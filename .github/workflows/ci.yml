name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:cli
      - run: npm run test:authoring
      - run: npm run package:release
      - run: npm run test:launcher
  verify:
    needs: launcher
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all launcher platforms
        run: node -e "if (process.env.LAUNCHER_RESULT !== 'success') process.exit(1)"
        env:
          LAUNCHER_RESULT: ${{ needs.launcher.result }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run notices:check
      - run: npm run typecheck
      # Unit tests already pass on every launcher matrix OS before this gate.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:player
      - run: npm run test:studio
      - run: npm run build:studio
